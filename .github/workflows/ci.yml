name: TripTales CI

on:
  push:
    branches:
      - master
      - readme
  pull_request:
    branches:
      - master
      - readme
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.17.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --runInBand
